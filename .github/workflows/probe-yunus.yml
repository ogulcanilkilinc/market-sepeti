name: Yunus bağlantı testi (geçici)

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS
        run: getent ahosts yunusonline.com www.yunusmarket.com.tr || true
      - name: TCP 443 / 80
        run: |
          for p in 443 80; do
            timeout 15 bash -c "</dev/tcp/195.214.148.250/$p" && echo "port $p açık" || echo "port $p kapalı/zaman aşımı"
          done
      - name: HTTPS yunusonline.com
        run: curl -sS -o /dev/null -m 25 -w "%{http_code} bağlan=%{time_connect}s toplam=%{time_total}s\n" -A "Mozilla/5.0" https://yunusonline.com/ || true
      - name: HTTP yunusonline.com
        run: curl -sS -o /dev/null -m 25 -w "%{http_code} bağlan=%{time_connect}s toplam=%{time_total}s\n" -A "Mozilla/5.0" http://yunusonline.com/ || true
      - name: Autocomplete
        run: curl -sS -m 25 -A "Mozilla/5.0" "https://yunusonline.com/Autocomplete/sut" | head -c 300 || true
      - name: yunusmarket.com.tr
        run: curl -sS -o /dev/null -m 25 -w "%{http_code} bağlan=%{time_connect}s\n" -A "Mozilla/5.0" https://www.yunusmarket.com.tr/ || true
      - name: Çıkış IP'si
        run: curl -s https://ipinfo.io/json || true
